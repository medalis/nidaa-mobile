name: Nidaa Mobile — Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Fabriquer l'APK
        run: |
          npm ci
          node build.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../nidaa-mobile-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nidaa-mobile
          path: nidaa-mobile-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-${{ github.run_number }}
          name: Nidaa Mobile ${{ github.run_number }}
          files: nidaa-mobile-test.apk
